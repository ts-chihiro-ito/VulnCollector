name: Collect vulnerabilities

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 翌06:00 JST (GitHubのcronは10〜30分遅延しうる)
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GHSA GraphQL用
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }} # 任意 (未設定でも動作)
        run: node scripts/collect.mjs

      # --- AI要約バッチ (最大6)。バッチファイルが無ければスキップ、失敗しても続行 ---
      - name: AI batch 1
        id: ai1
        if: ${{ hashFiles('tmp/ai/batch-1.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/summarize.prompt.yml
          file_input: |
            vulns: tmp/ai/batch-1.json
          max-completion-tokens: 4000

      - name: AI batch 2
        id: ai2
        if: ${{ hashFiles('tmp/ai/batch-2.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/summarize.prompt.yml
          file_input: |
            vulns: tmp/ai/batch-2.json
          max-completion-tokens: 4000

      - name: AI batch 3
        id: ai3
        if: ${{ hashFiles('tmp/ai/batch-3.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/summarize.prompt.yml
          file_input: |
            vulns: tmp/ai/batch-3.json
          max-completion-tokens: 4000

      - name: AI batch 4
        id: ai4
        if: ${{ hashFiles('tmp/ai/batch-4.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/summarize.prompt.yml
          file_input: |
            vulns: tmp/ai/batch-4.json
          max-completion-tokens: 4000

      - name: AI batch 5
        id: ai5
        if: ${{ hashFiles('tmp/ai/batch-5.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/summarize.prompt.yml
          file_input: |
            vulns: tmp/ai/batch-5.json
          max-completion-tokens: 4000

      - name: AI batch 6
        id: ai6
        if: ${{ hashFiles('tmp/ai/batch-6.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/summarize.prompt.yml
          file_input: |
            vulns: tmp/ai/batch-6.json
          max-completion-tokens: 4000

      - name: AI trends
        id: aitrends
        if: ${{ hashFiles('tmp/ai/trend-input.json') != '' }}
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/trends.prompt.yml
          file_input: |
            signals: tmp/ai/trend-input.json
          max-completion-tokens: 2000

      - name: Merge and write data files
        env:
          AI_OUT_1: ${{ steps.ai1.outputs.response-file }}
          AI_OUT_2: ${{ steps.ai2.outputs.response-file }}
          AI_OUT_3: ${{ steps.ai3.outputs.response-file }}
          AI_OUT_4: ${{ steps.ai4.outputs.response-file }}
          AI_OUT_5: ${{ steps.ai5.outputs.response-file }}
          AI_OUT_6: ${{ steps.ai6.outputs.response-file }}
          AI_OUT_TRENDS: ${{ steps.aitrends.outputs.response-file }}
        run: node scripts/merge.mjs

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: vulnerability intel $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
